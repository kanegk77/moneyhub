<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; connect-src 'none'; img-src 'none'"><title>MoneyHub — Bank authorisation return</title><style>body{font:16px Segoe UI,Arial,sans-serif;background:#edf4fd;color:#18365e;margin:0;padding:36px 16px}.panel{max-width:620px;margin:30px auto;background:white;padding:30px;border:1px solid #c4d7ec;border-radius:12px}h1{color:#07509d}p{line-height:1.55}.notice{background:#fff8e5;border:1px solid #ead5a2;padding:14px;border-radius:6px}button{background:#0864ce;color:#fff;border:0;border-radius:6px;padding:12px 18px;cursor:pointer}#result{overflow-wrap:anywhere;font-weight:600}small{color:#607c9b}</style></head><body><main class="panel"><h1>MoneyHub — Bank authorisation</h1><p id="result">Checking the bank's response…</p><p class="notice">This page does not connect to your bank, send data to another website, or store your authorisation details. Do not share the callback URL or its code with anyone.</p><button id="copy" hidden>Copy return URL for MoneyHub</button><p id="copied" aria-live="polite"></p><small>MoneyHub · read-only account information</small></main><script>
(function(){'use strict';const p=new URLSearchParams(location.search);const code=p.get('code'),state=p.get('state'),error=p.get('error');const result=document.getElementById('result'),button=document.getElementById('copy');if(error){result.textContent='Bank authorisation was not completed: '+error;return}if(!code||!state){result.textContent='No bank authorisation response was found. Return to MoneyHub to start the connection.';return}result.textContent='Bank authorisation returned successfully. The connection is not finished yet. Return to MoneyHub to complete it.';button.hidden=false;button.onclick=async function(){try{await navigator.clipboard.writeText(location.href);document.getElementById('copied').textContent='Return URL copied. Paste it only into MoneyHub’s authorisation completion screen.'}catch(e){document.getElementById('copied').textContent='Copy failed. Do not share this URL; return to MoneyHub for instructions.'}};history.replaceState(null,'',location.pathname);
})();
</script></body></html>
