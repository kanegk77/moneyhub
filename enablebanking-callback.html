<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>MoneyHub Bank Callback</title><style>body{font:16px Segoe UI,Arial,sans-serif;background:#edf4ff;color:#17345e;margin:0;padding:40px 16px}.card{max-width:650px;margin:auto;background:white;border:1px solid #b7d0ed;border-radius:12px;padding:30px}button{background:#0864ce;color:white;border:0;border-radius:6px;padding:13px 20px;font-size:16px;cursor:pointer}p{line-height:1.6}</style></head><body><main class="card"><h1>MoneyHub — Bank Authorisation</h1><p id="status">Checking bank response…</p><button id="copy" hidden>Copy callback URL for MoneyHub</button><p>Return to MoneyHub and paste the callback URL into the secure connection box. Never send the URL to anyone or post it in chat.</p></main><script>const p=new URLSearchParams(location.search);const ok=p.has('code')&&p.has('state')&&!p.has('error');const original=location.href;history.replaceState(null,'',location.pathname);document.getElementById('status').textContent=p.has('error')?'The bank authorisation was cancelled or declined. Return to MoneyHub and start again.':ok?'Bank authorisation returned. Copy the callback URL and finish inside MoneyHub.':'No bank authorisation response was found. Open this page only after starting a connection inside MoneyHub.';if(ok){const b=document.getElementById('copy');b.hidden=false;b.onclick=async()=>{try{await navigator.clipboard.writeText(original);b.textContent='Copied — return to MoneyHub'}catch{b.textContent='Clipboard unavailable. Copy the original callback URL from browser history.'}}}</script></body></html>
